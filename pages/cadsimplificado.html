<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Administrador</title>
    <link rel="stylesheet" href="../css/menuAcessibilidade.css">
<link rel="stylesheet" href="../css/estilos.css">
<script type="module" src="../dist/cadSimplificado.js"></script>
<script type="module" src="../dist/menuAcessibilidade.js"></script>
</head>

<body>
        <div id="divMenuAcessibilidade"></div>

<h1>
        Desenvolvimento de Sistemas
    </h1>

    <h2>
        Cadastro de Administrador
    </h2>

    <div id="divMensagem" role="alert"></div>

<form id="formCadSimplificado">

<div>

    <label for="txtNome">
        *Nome:
    </label>

    <input type="text" id="txtNome">

</div>

<div>

    <label for="txtEmail">
        *E-mail:
    </label>

    <input type="email" id="txtEmail">

</div>

<div>

    <label for="txtTelefone">
        *Telefone:
    </label>

    <input type="text" id="txtTelefone">

</div>

<div>

    <label for="txtSenha">
        *Senha:
    </label>

    <input type="password" id="txtSenha">

</div>

<div>

    <label for="txtConfirmaSenha">
        *Confirme sua Senha:
    </label>

    <input type="password" id="txtConfirmaSenha">

</div>

    <div>

    <button type="submit" id="btnEnviar">
        Enviar
    </button>

</div>

<div>

    <button type="reset">
        Limpar
    </button>

</div>

</form>
